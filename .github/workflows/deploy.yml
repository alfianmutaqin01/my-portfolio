# Builds the site on every push to main and publishes dist/ to the gh-pages branch,
# which GitHub Pages serves at https://alfianmutaqin01.github.io/my-portfolio/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish to gh-pages branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Surface the error in the run summary if publishing fails
          if ! npx gh-pages --dist dist --nojekyll \
            --repo "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            --message "Deploy ${{ github.sha }}" > publish.log 2>&1; then
            cat publish.log
            echo "::error title=Publish failed::$(tail -n 5 publish.log | tr '\n' ' ')"
            exit 1
          fi
          cat publish.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
